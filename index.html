<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Lior Today?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto 40px;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff4444;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 10px solid #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel.spinning {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            overflow: hidden;
        }

        .section-content {
            position: absolute;
            width: 200%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: skewY(18deg) rotate(6deg);
            transform-origin: 0% 100%;
            font-weight: bold;
            font-size: 18px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            padding-left: 60px;
        }

        .section:nth-child(1) { transform: rotate(0deg) skewY(-18deg); }
        .section:nth-child(2) { transform: rotate(72deg) skewY(-18deg); }
        .section:nth-child(3) { transform: rotate(144deg) skewY(-18deg); }
        .section:nth-child(4) { transform: rotate(216deg) skewY(-18deg); }
        .section:nth-child(5) { transform: rotate(288deg) skewY(-18deg); }

        .section:nth-child(1) .section-content { background: #FF6B6B; }
        .section:nth-child(2) .section-content { background: #4ECDC4; }
        .section:nth-child(3) .section-content { background: #45B7D1; }
        .section:nth-child(4) .section-content { background: #FFA07A; }
        .section:nth-child(5) .section-content { background: #98D8C8; }

        .center-circle {
            position: absolute;
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            padding: 20px;
        }

        .center-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            line-height: 1.3;
        }

        .spin-button {
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            min-height: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .wheel-container {
                width: 350px;
                height: 350px;
            }

            h1 {
                font-size: 1.8em;
            }

            .center-circle {
                width: 130px;
                height: 130px;
            }

            .center-text {
                font-size: 16px;
            }

            .section-content {
                font-size: 14px;
                padding-left: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Lior's Daily Identity Roulette 🎰</h1>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="section">
                    <div class="section-content">Unemployed</div>
                </div>
                <div class="section">
                    <div class="section-content">VC Bro</div>
                </div>
                <div class="section">
                    <div class="section-content">PE Bro</div>
                </div>
                <div class="section">
                    <div class="section-content">Consulting Bro</div>
                </div>
                <div class="section">
                    <div class="section-content">Tech Bro</div>
                </div>

                <div class="center-circle">
                    <div class="center-text">What is Lior today?</div>
                </div>
            </div>
        </div>

        <button class="spin-button" id="spinButton">SPIN!</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const result = document.getElementById('result');

        const options = [
            'Unemployed',
            'VC Bro',
            'PE Bro',
            'Consulting Bro',
            'Tech Bro'
        ];

        let currentRotation = 0;
        let isSpinning = false;

        spinButton.addEventListener('click', spin);

        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinButton.disabled = true;
            result.textContent = '';

            // Random spins between 5-10 full rotations plus random offset
            const spins = 5 + Math.random() * 5;
            const randomDegree = Math.random() * 360;
            const totalRotation = (spins * 360) + randomDegree;

            currentRotation += totalRotation;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Calculate which section we landed on
            // The pointer is at the top (0 degrees), so we need to calculate backwards
            setTimeout(() => {
                const normalizedRotation = currentRotation % 360;
                const adjustedRotation = (360 - normalizedRotation) % 360;
                const sectionIndex = Math.floor(adjustedRotation / 72);
                const selectedOption = options[sectionIndex];

                result.textContent = `Today Lior is: ${selectedOption}! 🎉`;
                isSpinning = false;
                spinButton.disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
